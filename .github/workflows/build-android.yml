name: Build Android

on:
  push:
    tags:
      - 'Android_v*'
      - 'Android_V*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;23.2.8568313'

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configure Godot Android paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/ndk_path = "${ANDROID_HOME}/ndk/23.2.8568313"
          EOF

      - name: Debug export preset
        run: |
          echo "=== export_presets.cfg ==="
          cat export_presets.cfg
          echo ""
          echo "=== editor settings ==="
          cat ~/.config/godot/editor_settings-4.3.tres || echo "No editor settings"
          echo ""
          echo "=== ANDROID_HOME ==="
          echo $ANDROID_HOME
          ls -la $ANDROID_HOME/build-tools/ || true
          ls -la $ANDROID_HOME/ndk/ || true

      - name: Configure project for Android
        run: |
          # Enable ETC2/ASTC (fixes blank configuration error on x86_64)
          if ! grep -q "import_etc2_astc" project.godot; then
            echo "" >> project.godot
            echo "[rendering]" >> project.godot
            echo "textures/vram_compression/import_etc2_astc=true" >> project.godot
          fi
          # Set editor settings
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Export Android
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: .
          archive_output: true
          presets_to_export: "Android"
          cache: false

      - name: Find and copy APK
        run: |
          mkdir -p build/android
          # Look in the firebelley action's archive directory
          ARCHIVE=$(find /home/runner/.local/share/godot/archives -name '*.zip' 2>/dev/null | head -1)
          if [ -n "$ARCHIVE" ]; then
            echo "Found archive: $ARCHIVE"
            unzip -o "$ARCHIVE" -d /tmp/android-extract
            find /tmp/android-extract -name '*.apk' -exec cp {} build/android/3D-Viewer.apk \;
          fi
          # Fallback: look anywhere
          if [ ! -f build/android/3D-Viewer.apk ]; then
            find / -name '*.apk' 2>/dev/null | head -5
            find / -name '*.apk' 2>/dev/null -exec cp {} build/android/3D-Viewer.apk \;
          fi
          if [ ! -f build/android/3D-Viewer.apk ]; then
            echo "ERROR: APK not found"
            exit 1
          fi
          ls -la build/android/

      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > keystore.jks
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --key-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out build/android/3D-Viewer-signed.apk \
            build/android/3D-Viewer.apk
          mv build/android/3D-Viewer-signed.apk build/android/3D-Viewer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/3D-Viewer.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/android/3D-Viewer.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
