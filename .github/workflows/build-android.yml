name: Build Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p /github/home/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* /github/home/.local/share/godot/export_templates/4.3.stable/
          ls /github/home/.local/share/godot/export_templates/4.3.stable/ | grep android

      - name: Configure Android paths
        run: |
          mkdir -p /github/home/.config/godot /root/.config/godot
          for f in /github/home/.config/godot/editor_settings-4.3.tres /root/.config/godot/editor_settings-4.3.tres; do
            cat > "$f" << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

      - name: Export Android
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/3D-Viewer.apk 2>&1 | tail -50
          if [ ! -f build/android/3D-Viewer.apk ]; then
            echo "ERROR: APK was not created"
            find . -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          echo "APK created"
          ls -la build/android/

      - name: Sign APK
        run: |
          if [ ! -f build/android/3D-Viewer.apk ]; then
            echo "ERROR: APK not found for signing"
            exit 1
          fi
          export PATH="$PATH:/opt/android-sdk/build-tools/34.0.0"
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > keystore.jks
          apksigner sign --ks keystore.jks \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --key-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out build/android/3D-Viewer-signed.apk build/android/3D-Viewer.apk
          mv build/android/3D-Viewer-signed.apk build/android/3D-Viewer.apk
          echo "Signed successfully"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/3D-Viewer.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/android/3D-Viewer.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
