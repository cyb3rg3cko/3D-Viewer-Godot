name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export Godot project
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: .
          archive_output: true
          cache: true
          presets_to_export: "Linux,Windows Desktop"

      - name: Upload raw builds
        uses: actions/upload-artifact@v4
        with:
          name: godot-builds
          path: ${{ steps.export.outputs.archive_directory }}

  linux-deb:
    runs-on: ubuntu-22.04
    needs: export
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: godot-builds
          path: builds

      - name: Build DEB
        run: |
          chmod +x Installers/Linux/build-deb.sh
          cd Installers/Linux
          mkdir -p extracted
          echo "Extracting Linux archive..."
          unzip -o ../../builds/Linux.zip -d extracted || unzip -o ../../builds/*.zip -d extracted
          echo "Looking for Linux binary..."
          find extracted -type f \( -name '*.x86_64' -o -name '3D-Viewer' \) | head -20
          LINUX_BIN=$(find extracted -type f \( -name '*.x86_64' -o -name '3D-Viewer' \) | head -1)
          if [ -n "$LINUX_BIN" ]; then
            cp "$LINUX_BIN" ./3D-Viewer.x86_64
            echo "Copied $LINUX_BIN"
          else
            echo "ERROR: Linux binary not found"
            find ../../builds -type f | head -50
            exit 1
          fi
          LINUX_PCK=$(find extracted -type f -name '*.pck' | head -1)
          if [ -n "$LINUX_PCK" ]; then
            cp "$LINUX_PCK" ./3D-Viewer.pck
          fi
          ls -la
          ./build-deb.sh

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: Installers/Linux/*.deb

  windows-installer:
    runs-on: windows-latest
    needs: export
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: godot-builds
          path: builds

      - name: Prepare installer files
        shell: bash
        run: |
          mkdir -p Installers/Windows
          mkdir -p builds/extracted
          echo "Extracting archives..."
          unzip -o "builds/Windows Desktop.zip" -d builds/extracted/windows || unzip -o builds/*.zip -d builds/extracted
          echo "Looking for Windows binary..."
          find builds/extracted -type f -name '*.exe' | head -20
          WIN_BIN=$(find builds/extracted -type f -name '*.exe' | head -1)
          if [ -n "$WIN_BIN" ]; then
            cp "$WIN_BIN" Installers/Windows/3D-Viewer.exe
            echo "Copied $WIN_BIN"
          else
            echo "ERROR: Windows binary not found"
            find builds -type f | head -50
            exit 1
          fi
          WIN_PCK=$(find builds/extracted -type f -name '*.pck' | head -1)
          if [ -n "$WIN_PCK" ]; then
            cp "$WIN_PCK" Installers/Windows/3D-Viewer.pck
          fi
          ls -la Installers/Windows

      - name: Build Windows Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: Installers/Windows/installer.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Installers/Windows/*.exe

  release:
    runs-on: ubuntu-latest
    needs: [export, linux-deb, windows-installer]
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
