name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export Godot project
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: .
          archive_output: true
          cache: true
          presets_to_export: "Linux,Windows Desktop"

      - name: Upload raw builds
        uses: actions/upload-artifact@v4
        with:
          name: godot-builds
          path: ${{ steps.export.outputs.archive_directory }}

  linux-deb:
    runs-on: ubuntu-22.04
    needs: export
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: godot-builds
          path: builds

      - name: Build DEB
        run: |
          chmod +x Installers/Linux/build-deb.sh
          cd Installers/Linux
          # Copy Linux binary and pck from the Godot export output
          find ../../builds -path '*/Linux/*' -name '*.x86_64' -exec cp {} ./3D-Viewer.x86_64 \; || true
          find ../../builds -path '*/Linux/*' -name '*.pck' -exec cp {} ./3D-Viewer.pck \; || true
          ls -la
          ./build-deb.sh

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: Installers/Linux/*.deb

  windows-installer:
    runs-on: windows-latest
    needs: export
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: godot-builds
          path: builds

      - name: Prepare installer files
        shell: bash
        run: |
          mkdir -p Installers/Windows
          find builds -name '*.exe' -exec cp {} Installers/Windows/3D-Viewer.exe \; || true
          find builds -name '*.pck' -exec cp {} Installers/Windows/3D-Viewer.pck \; || true

      - name: Build Windows Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: Installers/Windows/installer.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Installers/Windows/*.exe

  release:
    runs-on: ubuntu-latest
    needs: [export, linux-deb, windows-installer]
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
